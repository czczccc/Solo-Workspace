services:
  app:
    build: .
    image: solo-workspace:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/solo.db
      BACKUP_DIR: /data/backups
    volumes:
      - solo-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  solo-data:
  caddy-data:
  caddy-config:
